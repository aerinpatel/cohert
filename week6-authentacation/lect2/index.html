<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week-6 Authentication</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
        }
        .card {
            background: #1e1e1e;
            border: none;
        }
        .card-header {
            background: #272727;
        }
        label {
            font-weight: 500;
        }
    </style>
    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <!-- Sign Up Card -->
                <div class="card mb-4">
                    <div class="card-header text-center">
                        <h5 class="mb-0">Sign Up</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="signup-username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="signup-username" placeholder="Enter username">
                        </div>
                        <div class="mb-3">
                            <label for="signup-password1" class="form-label">Password</label>
                            <input type="password" class="form-control" id="signup-password1" placeholder="Enter password">
                        </div>
                        <div class="mb-3">
                            <label for="signup-password2" class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" id="signup-password2" placeholder="Re-enter password">
                        </div>
                        <button class="btn btn-primary w-100" onclick="signup()">Submit</button>
                    </div>
                </div>

                <!-- Sign In Card -->
                <div class="card mb-4">
                    <div class="card-header text-center">
                        <h5 class="mb-0">Sign In</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="signin-username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="signin-username" placeholder="Enter username">
                        </div>
                        <div class="mb-3">
                            <label for="signin-password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="signin-password" placeholder="Enter password">
                        </div>
                        <button class="btn btn-primary w-100" onclick="signin()">Submit</button>
                    </div>
                </div>

                <!-- Logout Section -->
                <div class="text-center">
                    <button class="btn btn-secondary" onclick="logout()">Logout</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Inline Custom JS -->
    <script>
        async function signup(){
            const pass = document.getElementById('signup-password1').value;
            const pass2 = document.getElementById('signup-password2').value;
            if(pass !== pass2){
                alert('Both passwords do not match');
                return;
            }
            const name = document.getElementById('signup-username').value;
            try {
                const response = await axios.post("http://localhost:3000/signup", {
                    username: name,
                    password: pass
                });
                alert('You have signed up successfully');
            } catch (err) {
                alert('Signup failed');
                console.error(err);
            }
        }
        async function signin(){
            const pass = document.getElementById('signin-password').value;
            const name = document.getElementById('signin-username').value;
            try {
                const response = await axios.post("http://localhost:3000/signin", {
                    username: name,
                    password: pass
                });
                localStorage.setItem("token", response.data.token);
                alert('You have signed in successfully');
            } catch (err) {
                alert('Signin failed');
                console.error(err);
            }
        }   
        async function logout(){
            localStorage.removeItem('token');
            alert('You have signed out successfully');
        }
    </script>
    
    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
